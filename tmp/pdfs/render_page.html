<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rendering PDF</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #d7d9dd;
      }

      body {
        display: grid;
        place-items: start center;
        padding: 24px;
      }

      canvas {
        display: block;
        background: white;
        box-shadow: 0 3px 18px rgb(0 0 0 / 22%);
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as pdfjs from './pdf.mjs';

      pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
      const pageNumber = Number(new URLSearchParams(location.search).get('page') || 1);
      const pdf = await pdfjs.getDocument('./seo_source.pdf').promise;
      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({ scale: 1.55 });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d', { alpha: false });
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      document.body.append(canvas);
      await page.render({ canvasContext: context, viewport }).promise;
      document.documentElement.dataset.ready = 'true';
      document.title = `READY-${pageNumber}`;
    </script>
  </body>
</html>
